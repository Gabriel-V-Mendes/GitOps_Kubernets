<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitOps Lab - My App</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 3rem;
            max-width: 500px;
        }
        h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .status { color: #00e676; font-size: 1.2rem; }
        .info { color: #aaa; margin-top: 1rem; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>GitOps Lab</h1>
        <p class="status">✅ Deploy automatizado via ArgoCD</p>
        <p class="info">Kubernetes • Helm • Kustomize • GitOps</p>
    </div>
</body>
</html>
