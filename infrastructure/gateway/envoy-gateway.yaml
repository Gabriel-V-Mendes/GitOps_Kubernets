# Configuração da Gateway API (gateway.networking.k8s.io/v1) usando Envoy Gateway.
#
# Por que Envoy Gateway no Kind? (ver docs/adr/002-gateway-api-controller.md)
#   1. Projeto oficial da CNCF focado 100% na especificação Gateway API.
#   2. No Kind não há LoadBalancer de nuvem (Services LoadBalancer ficam <pending>).
#      O CRD `EnvoyProxy` permite fixar o Service do data-plane como `NodePort` na
#      porta 30080, casando exatamente com o `extraPortMappings` do Kind (8080 -> 30080).
#   3. Suporta divisão nativa de tráfego (weights em HTTPRoute) para Canary / Argo Rollouts.
#
# Pré-requisito (executado pelo `make bootstrap`):
#   helm upgrade --install eg oci://docker.io/envoyproxy/gateway-helm \
#     --version v1.3.0 -n envoy-gateway-system --create-namespace --wait
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: kind-nodeport-proxy
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: NodePort
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - name: http-80
                  port: 80
                  targetPort: 10080
                  protocol: TCP
                  nodePort: 30080
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: kind-nodeport-proxy
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared-gateway
  namespace: envoy-gateway-system
  labels:
    app.kubernetes.io/part-of: gitops-platform
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          # Permite que HTTPRoutes nos namespaces `dev` e `staging` se conectem a este Gateway
          from: All
