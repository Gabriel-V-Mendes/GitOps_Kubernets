# Configuração declarativa do cluster Kind para o laboratório GitOps.
#
# Mudança importante em relação à versão anterior:
#   - SAIU o Ingress NGINX (aposentado pelo Kubernetes SIG Network) e a label
#     legada `ingress-ready=true`.
#   - ENTRARAM os NodePorts fixos (30080/30443) mapeados via `extraPortMappings`
#     para as portas 8080/8443 do host. O Envoy Gateway (controller da Gateway API)
#     expõe seu data-plane exatamente nesses NodePorts, permitindo acesso local
#     sem depender de um LoadBalancer de nuvem.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: devops-lab
nodes:
  - role: control-plane
    extraPortMappings:
      # HTTP: localhost:8080 (host) -> NodePort 30080 (Envoy Gateway data-plane)
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
      # HTTPS: localhost:8443 (host) -> NodePort 30443 (Envoy Gateway data-plane)
      - containerPort: 30443
        hostPort: 8443
        listenAddress: "127.0.0.1"
        protocol: TCP