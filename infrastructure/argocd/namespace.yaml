# Namespace do ArgoCD (controlador GitOps).
# Instalação oficial (manifesto upstream do projeto Argo, sem chart da Bitnami):
#   kubectl apply -f infrastructure/argocd/namespace.yaml
#   kubectl apply -n argocd --server-side --force-conflicts \
#     -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    app.kubernetes.io/name: argocd
    app.kubernetes.io/part-of: gitops-platform
