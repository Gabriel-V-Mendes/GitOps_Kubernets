# Service Mesh - Istio
# Configuração do Istio Service Mesh para comunicação segura entre microsserviços
#
# Funcionalidades:
#   - mTLS Automático: Criptografia ponta a ponta entre todos os Pods
#   - Circuit Breaker/Retries: Resiliência automática contra falhas
#   - Controle de Tráfego Avançado: Gerenciamento cirúrgico de rotas
#
# Instalação via istioctl:
#   curl -L https://istio.io/downloadIstio | sh -
#   cd istio-* && export PATH=$PWD/bin:$PATH
#   istioctl install --set profile=demo -y
#
# Verificação:
#   kubectl get pods -n istio-system
#   istioctl analyze

apiVersion: v1
kind: Namespace
metadata:
  name: istio-system
  labels:
    app.kubernetes.io/name: istio
    app.kubernetes.io/part-of: service-mesh
