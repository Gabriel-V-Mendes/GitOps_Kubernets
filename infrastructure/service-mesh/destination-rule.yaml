# DestinationRule - Circuit Breaker & Resiliência para my-app
#
# Esta regra configura políticas de resiliência para o serviço my-app:
#   - Circuit Breaker: Limita conexões simultâneas para evitar cascata de falhas
#   - Outlier Detection: Remove automaticamente Pods que estão falhando
#   - TLS: Força mTLS na comunicação com este serviço
#
# O Circuit Breaker "abre o circuito" quando:
#   - Mais de 100 conexões simultâneas por Pod
#   - Mais de 1000 requisições pendentes por Pod
#
# O Outlier Detection ejeta um Pod quando:
#   - 5 erros 5xx consecutivos (consecutiveGatewayErrors)
#   - A cada 30 segundos é feita uma verificação
#   - Pod ejetado fica fora por 30 segundos antes de voltar

apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: my-app-circuit-breaker
  namespace: dev
spec:
  host: my-app-gitops-service.dev.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        h2UpgradePolicy: DEFAULT
        http1MaxPendingRequests: 1000
        http2MaxRequests: 1000
        maxRequestsPerConnection: 10
        maxRetries: 3
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
    tls:
      mode: ISTIO_MUTUAL
