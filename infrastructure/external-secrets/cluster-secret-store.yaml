# External Secrets Operator (ESO) — ClusterSecretStore
#
# Arquitetura de Segredos (Zero Segredos em Texto Puro no Git):
#   1. A semente de credenciais fica criptografada no Git com SOPS + age
#      (`infrastructure/secrets/postgres-source-secret.sops.yaml`).
#   2. No bootstrap do cluster, o SOPS descriptografa em memória e aplica o Secret
#      fonte apenas no namespace isolado `external-secrets`.
#   3. Este `ClusterSecretStore` lê do namespace `external-secrets` com RBAC mínimo
#      e permite que os recursos `ExternalSecret` (gerenciados pelo ArgoCD nos
#      namespaces `dev` e `staging`) sintetizem os Secrets das aplicações (`DATABASE_URL`,
#      `POSTGRES_PASSWORD`, etc.) automaticamente.
#   4. Em produção na nuvem, basta trocar o bloco `provider.kubernetes` por
#      `provider.aws` (Secrets Manager), `provider.gcpsm` ou `provider.vault`, sem
#      alterar uma única linha do Helm chart da aplicação.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-k8s-store-sa
  namespace: external-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-k8s-store-reader
  namespace: external-secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["postgres-source-secret"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-k8s-store-reader-binding
  namespace: external-secrets
subjects:
  - kind: ServiceAccount
    name: eso-k8s-store-sa
    namespace: external-secrets
roleRef:
  kind: Role
  name: eso-k8s-store-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: k8s-secret-store
spec:
  provider:
    kubernetes:
      remoteNamespace: external-secrets
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: external-secrets
      auth:
        serviceAccount:
          name: eso-k8s-store-sa
          namespace: external-secrets
