replicaCount: 2

image:
  repository: my-app
  tag: local
  pullPolicy: Never

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false

istio:
  gateway:
    enabled: true
    host: "app.local"

monitoring:
  enabled: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
