# ==============================================================================
# Values base da API do Projeto 1 (FastAPI + PostgreSQL 17)
# Sobrescrito por ambiente via `values-dev.yaml` e `values-staging.yaml`.
# ==============================================================================

replicaCount: 1

image:
  # Imagem publicada pelo pipeline CI/CD do Projeto 1 (repositório separado de código)
  repository: ghcr.io/gabriel-v-mendes/containeriza-opipelinecicd
  tag: "sha-74f3e26566a1c1dc9033d18d9b6f2beddfc7eb8c"
  pullPolicy: IfNotPresent

app:
  name: "DevOps API"

service:
  type: ClusterIP
  port: 8000

# Contexto de segurança do Pod/Container (espelha o hardening do Projeto 1: UID 10001, read-only rootfs)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Probes separadas (Liveness não toca no banco; Readiness valida SELECT 1 no PostgreSQL)
probes:
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /health/ready
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# Requests e Limits obrigatórios para governança de recursos no cluster
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

# ==============================================================================
# Segredos: NUNCA vão ao Git em texto puro ou base64.
# O ExternalSecret busca as credenciais do ClusterSecretStore (alimentado via SOPS)
# e sintetiza o Secret `<fullname>-db-secret` com DATABASE_URL no cluster.
# ==============================================================================
externalSecret:
  enabled: true
  refreshInterval: 1m
  secretStoreRef:
    name: k8s-secret-store
    kind: ClusterSecretStore
  remoteSecretName: postgres-source-secret

# Caso queira apontar para um Secret já criado manualmente/SOPS direto sem ESO:
existingSecret: ""

# ==============================================================================
# PostgreSQL 17 próprio no chart (evita charts da Bitnami)
# Usa exatamente a mesma imagem oficial alpine fixada por digest do Projeto 1.
# ==============================================================================
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24"
    pullPolicy: IfNotPresent
  service:
    port: 5432
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

# ==============================================================================
# Gateway API (gateway.networking.k8s.io/v1) — Substitui o antigo Ingress NGINX
# ==============================================================================
gatewayApi:
  enabled: true
  parentGateway:
    name: shared-gateway
    namespace: envoy-gateway-system
  hostnames:
    - "dev.api.local"
  pathPrefix: /

# ==============================================================================
# NetworkPolicy (Zero-Trust entre namespaces e isolamento do PostgreSQL)
# ==============================================================================
networkPolicy:
  enabled: true
  gatewayNamespace: envoy-gateway-system

# ==============================================================================
# Autoscaling (HPA)
# ==============================================================================
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# ==============================================================================
# Desafio Opcional: Argo Rollouts com divisão real de tráfego via Gateway API
# Por padrão fica desativado (`enabled: false`), usando Deployment padrão do K8s.
# ==============================================================================
rollout:
  enabled: false
  steps:
    - setWeight: 20
    - pause: { duration: 30s }
    - setWeight: 50
    - pause: { duration: 30s }
    - setWeight: 100

# ==============================================================================
# Monitoramento opcional (ServiceMonitor para Prometheus Operator)
# ==============================================================================
monitoring:
  enabled: false
