{{- if .Values.networkPolicy.enabled -}}
# 1. Permite tráfego na porta 8000 da API vindo do Envoy Gateway ou do próprio namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "devops-api.fullname" . }}-api-netpol
  labels:
    {{- include "devops-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "devops-api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.gatewayNamespace }}
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
---
{{- if .Values.postgresql.enabled }}
# 2. Isola o PostgreSQL: apenas os pods da API no mesmo namespace podem conectar na porta 5432
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "devops-api.fullname" . }}-postgres-netpol
  labels:
    {{- include "devops-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "devops-api.postgresSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "devops-api.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.postgresql.service.port }}
{{- end }}
{{- end }}
