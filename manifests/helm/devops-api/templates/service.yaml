apiVersion: v1
kind: Service
metadata:
  name: {{ include "devops-api.fullname" . }}
  labels:
    {{- include "devops-api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "devops-api.selectorLabels" . | nindent 4 }}
---
{{- if .Values.rollout.enabled }}
# Service canário usado pelo Argo Rollouts + Gateway API plugin para divisão real de tráfego
apiVersion: v1
kind: Service
metadata:
  name: {{ include "devops-api.fullname" . }}-canary
  labels:
    {{- include "devops-api.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "devops-api.selectorLabels" . | nindent 4 }}
{{- end }}
