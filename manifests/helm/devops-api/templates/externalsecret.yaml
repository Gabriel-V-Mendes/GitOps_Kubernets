{{- if .Values.externalSecret.enabled -}}
# ExternalSecret: busca credenciais no ClusterSecretStore (sem segredos em texto puro no Git)
# e sintetiza o Secret `{{ include "devops-api.secretName" . }}` no namespace da aplicação.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "devops-api.fullname" . }}-db-es
  labels:
    {{- include "devops-api.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ include "devops-api.secretName" . }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        POSTGRES_USER: "{{ `{{ .username }}` }}"
        POSTGRES_PASSWORD: "{{ `{{ .password }}` }}"
        POSTGRES_DB: "{{ `{{ .database }}` }}"
        DATABASE_URL: "postgresql+psycopg://{{ `{{ .username }}:{{ .password }}` }}@{{ include "devops-api.fullname" . }}-postgres:{{ .Values.postgresql.service.port }}/{{ `{{ .database }}` }}"
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.externalSecret.remoteSecretName }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecret.remoteSecretName }}
        property: password
    - secretKey: database
      remoteRef:
        key: {{ .Values.externalSecret.remoteSecretName }}
        property: database
{{- end }}
