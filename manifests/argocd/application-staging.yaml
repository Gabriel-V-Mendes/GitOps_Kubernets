# ArgoCD Application — Ambiente STAGING
# Vigia o repositório Git de manifests e sincroniza continuamente o estado do
# namespace `staging` usando o Helm chart `devops-api` + `values-staging.yaml`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-api-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Gabriel-V-Mendes/GitOps_Kubernets.git
    targetRevision: HEAD
    path: manifests/helm/devops-api
    helm:
      valueFiles:
        - values.yaml
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jqPathExpressions:
        - .spec.rules[].backendRefs
  syncPolicy:
    automated:
      prune: true       # Recursos removidos do Git são removidos automaticamente do cluster
      selfHeal: true    # Drift manual no cluster é desfeito automaticamente pelo ArgoCD
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
