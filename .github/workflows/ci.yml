name: Validate Manifests & Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ============================================================================
  # Garante que NENHUM segredo em texto puro ou Secret não criptografado vá ao Git
  # ============================================================================
  secrets:
    name: Secret Scan & Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks (histórico completo)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose --exit-code 1

      - name: Proibir kind:Secret não criptografado em manifests/
        run: |
          if grep -RInE '^[[:space:]]*kind:[[:space:]]*Secret([[:space:]]|$)' manifests/; then
            echo "::error::Encontrado 'kind: Secret' em manifests/. Use ExternalSecret ou SOPS!"
            exit 1
          fi
          echo "OK: Nenhum kind: Secret em texto puro/base64 encontrado em manifests/."

  # ============================================================================
  # Valida Helm Chart (dev, staging, rollout), Kustomize, probes e requests/limits
  # ============================================================================
  validate:
    name: Helm Lint & Schema Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm Lint (dev, staging e Argo Rollouts opcional)
        run: |
          CHART="manifests/helm/devops-api"
          helm lint "$CHART" -f "$CHART/values.yaml" -f "$CHART/values-dev.yaml"
          helm lint "$CHART" -f "$CHART/values.yaml" -f "$CHART/values-staging.yaml"
          helm lint "$CHART" -f "$CHART/values.yaml" --set rollout.enabled=true

      - name: Renderizar templates e validar probes + requests/limits
        run: |
          CHART="manifests/helm/devops-api"
          for env in dev staging; do
            out="/tmp/rendered-${env}.yaml"
            helm template "devops-api-${env}" "$CHART" \
              -n "$env" \
              -f "$CHART/values.yaml" \
              -f "$CHART/values-${env}.yaml" > "$out"

            grep -q "livenessProbe:" "$out"
            grep -q "path: /health" "$out"
            grep -q "readinessProbe:" "$out"
            grep -q "path: /health/ready" "$out"
            grep -q "requests:" "$out"
            grep -q "limits:" "$out"
            grep -q "kind: HTTPRoute" "$out"
            grep -q "kind: ExternalSecret" "$out"
          done

      - name: Validar schemas Kubernetes com kubeconform
        run: |
          docker run --rm -v /tmp:/rendered ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -ignore-missing-schemas -summary \
            /rendered/rendered-dev.yaml /rendered/rendered-staging.yaml

      - name: Validar kustomization das Applications do ArgoCD
        run: |
          kubectl kustomize manifests/argocd > /tmp/argocd-apps.yaml
          grep -q "selfHeal: true" /tmp/argocd-apps.yaml
          grep -q "prune: true" /tmp/argocd-apps.yaml
