name: GitOps CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'app/**' # O pipeline só roda se mexermos no código da aplicação

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e Push da Imagem Docker
        env:
          IMAGE_TAG: ${{ github.sha }}
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
        run: |
          # Faremos o build apontando para a pasta app/
          docker build -t $DOCKER_USER/my-app:${IMAGE_TAG} ./app
          docker push $DOCKER_USER/my-app:${IMAGE_TAG}

      - name: Atualiza Helm Values e Commit (O Motor GitOps)
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # O comando 'sed' procura a linha "tag:" no values.yaml e substitui pela nova tag
          sed -i "s/tag: .*/tag: ${IMAGE_TAG}/" manifests/helm/my-app/values.yaml
          
          # Configura o robô do GitHub para fazer o commit
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add manifests/helm/my-app/values.yaml
          git commit -m "chore(gitops): atualiza imagem para ${IMAGE_TAG} [skip ci]"
          git push
